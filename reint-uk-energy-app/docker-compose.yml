version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reint-energy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENVIRONMENT=production
      - APP_DEBUG=false
      - APP_ELEXON_API_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - APP_ELEXON_TIMEOUT_SECONDS=10.0
      - APP_ENABLE_LIVE_ELEXON_FETCH=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - energy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reint-energy-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - energy-network

networks:
  energy-network:
    driver: bridge
